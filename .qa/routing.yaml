# Transmission sélective qa-mesh/2.0 — SOURCE UNIQUE
# Remplace la table prose d'ARCHITECTURE.md §2. Exécutée par `qa-mesh filter`.
# Règle d'or : chaque agent ne reçoit QUE les champs qu'il consomme.
#
# Grammaire d'un champ (cf. kernel src/routing/project.ts) :
#   domain                              champ simple
#   session.{a,b}                       projection d'objet
#   pages[].{url,title}                 projection par élément de tableau
#   api_calls                          sous-arbre complet
#   results[?failure.kind==SCRIPT].{…}  filtre de tableau + projection
#
# Les sélecteurs ne transitent JAMAIS par filter : ils viennent de `qa-mesh db pack`.

edges:
  "agent-0->agent-1":
    description: "0 -> 1 : domaine, routes du domaine, session"
    fields:
      - domain
      - coverage_gaps[].{route,domain,priority}
      - session.{role,storage_state_path,expires_at}

  "agent-1->agent-2":
    description: "1 -> 2 : pages et éléments sans sélecteurs ni API"
    fields:
      - pages[].{url,title,complexity}
      - elements[].{page,label,type,action}

  "agent-1->agent-3":
    description: "1 -> 3 : catalogue complet SANS sélecteurs"
    fields:
      - pages
      - elements[].{page,label,type,action}
      - api_calls

  "agent-2->agent-3":
    description: "2 -> 3 : parcours complets"
    fields:
      - journeys

  "agent-2->agent-4":
    description: "2 -> 4 : index des scénarios automatisables"
    fields:
      - journeys[].{id,feature,role,type,priority,steps,variants}

  "agent-4->agent-5":
    description: "4 -> 5 : chemins des specs (la commande vient de la config)"
    fields:
      - files
      - scenarios_covered[].{scenario_id,spec,test_title}

  "agent-5->agent-6":
    description: "5 -> 6 : UNIQUEMENT les échecs SCRIPT + contexte"
    fields:
      - results[?failure.kind==SCRIPT].{id,spec,title,failure}
